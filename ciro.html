<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esempio di Tabella</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <h2>Tabella Esempio</h2>

    <table>
        <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Età</th>
        </tr>
        <tr>
            <td>Marco</td>
            <td>Rossi</td>
            <td>28</td>
        </tr>
        <tr>
            <td>Giulia</td>
            <td>Bianchi</td>
            <td>32</td>
        </tr>
        <tr>
            <td>Luca</td>
            <td>Verdi</td>
            <td>24</td>
        </tr>
    </table>

</body>
</html>
